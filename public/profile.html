<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">

        <link rel='stylesheet' href="style.css">
        <meta name="viewport" content="width=device-width, initail-scrale=1">
    </head>
    <body>
        <div id="pond">
            <div class="fish">
                <h2 id="open">Загрузка....</h2>
                <button id="logoutBtn">выйти</button>
            </div>
        </div>

        <script>
            fetch('/me')
            .then ((r) => {
                if (!r.ok) {
                    window.location.href = '/login.html';
                    return null;
                }
                return r.json();
            })
            .then((d) => {
                if (d) document.getElementById(Здрастьвуите) .textContent = 'Вы зашли как' + d.login;
            });
            document.getElementById('logoutBtn').addEventListener('click', async () => {
                await fetch('/logout', {method: 'POST'});
                window.location.href = '/login.html';
            });
        </script>
    </body>
